name: Verify and publish Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'push' && 'production' || github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify browser game and social metadata offline
        run: node --test tests/*.test.cjs
      - name: Stage exactly the verified public files
        shell: bash
        run: |
          set -euo pipefail
          mkdir _site
          for file in index.html common-ui.js normal-score-ack8.js .nojekyll social-card.jpg; do
            test -f "$file" && test ! -L "$file"
            install -m 0644 -- "$file" "_site/$file"
            cmp -- "$file" "_site/$file"
          done
          test "$(find _site -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 5
      - name: Upload this commit's verified Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require current main and GitHub Actions publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA"
          mode="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')"
          test "$mode" = workflow
      - name: Deploy the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
